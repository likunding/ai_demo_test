server:
  port: 8882

spring:
  application:
    name: springai-demo
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    model:
      chat-provider: ${CHAT_PROVIDER:ollama}
      vision-provider: ${VISION_PROVIDER:ollama}
      code-provider: ${CODE_PROVIDER:ollama}

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:deepseek-coder:6.7b}
          temperature: 0.2
          max-tokens: 2048
      vision:
        options:
          model: ${OLLAMA_VISION_MODEL:qwen2.5vl:7b}
          temperature: 0.1
          max-tokens: 2048
          context-window: ${OLLAMA_VISION_CONTEXT_WINDOW:8192}
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}

    openai:
      api-key: ${VLLM_API_KEY:dummy}
      base-url: ${VLLM_BASE_URL:http://localhost:8000/v1}
      chat:
        options:
          model: ${VLLM_CHAT_MODEL:deepseek-coder:6.7b-instruct}
          temperature: 0.2
          max-tokens: 2048
      vision:
        options:
          model: ${VLLM_VISION_MODEL:deepseek-coder:6.7b-instruct}
          temperature: 0.1
          max-tokens: 2048
      embedding:
        options:
          model: ${VLLM_EMBED_MODEL:nomic-embed-text}

    doubao:
      api-key: ${DOUBAO_API_KEY:}
      base-url: ${DOUBAO_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      chat:
        options:
          model: ${DOUBAO_CHAT_MODEL:doubao-seed-2-1-pro-260628}
          temperature: 0.2
          max-tokens: 2048
      vision:
        options:
          model: ${DOUBAO_VISION_MODEL:doubao-seed-2-1-pro-260628}
          temperature: 0.1
          max-tokens: 2048

app:
  rag:
    documents-path: ${RAG_DOCS_PATH:./docs}
    chunk-size: 500
    chunk-overlap: 50
    top-k: 3
  workflow:
    max-retry-loops: 3

logging:
  level:
    org.springframework.ai: DEBUG
    com.dezhou: DEBUG
